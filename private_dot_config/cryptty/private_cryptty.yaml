font:
  fallback:
  - LXGW WenKai GB Screen
  # embolden: 0.0
  family: FantasqueSansM Nerd Font Mono
  size: 14
  hinting: false
colors:
  primary:
    foreground: '#f8f8f2'
    background: '#282a36'
  cursor:
    cursor: '#f8f8f2'
  normal:
    black: '#21222c'
    red: '#ff5555'
    green: '#50fa7b'
    yellow: '#f1fa8c'
    blue: '#6272a4'
    magenta: '#ff79c6'
    cyan: '#8be9fd'
    white: '#f8f8f2'
  bright:
    black: '#6272a4'
    red: '#ff6e6e'
    green: '#69ff94'
    yellow: '#ffffa5'
    blue: '#6272a4'
    magenta: '#ff92df'
    cyan: '#a4ffff'
    white: '#ffffff'

window:
  opengl_color_format: rgba16f
  # option_as_alt: only_left
  # padding:
  #   x: 2
  #   y: 2
  opacity: 0.8
  blur: true

keyboard:
